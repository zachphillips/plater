name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    uses: zachphillips/ibsky/.github/workflows/base.yml@main
    with:
      working-directory: "."
  fable-review:
    if: github.event_name == 'pull_request'
    uses: zachphillips/ibsky/.github/workflows/fable-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
