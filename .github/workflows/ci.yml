name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Nothing to install: Plater has zero runtime dependencies.
      - name: Syntax-check every source file
        run: npm run lint
      - name: Test
        run: npm test
