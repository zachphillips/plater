<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZMS Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 "Inter", system-ui, sans-serif; background: #0d0d0d; color: #e8e3d9; }
    main { max-width: 760px; margin: 0 auto; padding: 5rem 1.5rem 6rem; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.15; letter-spacing: -0.02em; }
    .subhead { color: #8a8277; font-size: 1.1rem; }
    ul { padding-left: 1.2rem; } li { margin: 0.3rem 0; }
    .cards { display: grid; gap: 0.75rem; margin-top: 1.5rem; }
    .card { border: 1px solid #2a2a2a; border-radius: 8px; padding: 1rem 1.2rem; background: #141414; }
    .card h3 { margin: 0 0 0.25rem; color: #c9a96e; font-size: 1rem; }
    .card p { margin: 0; color: #8a8277; font-size: 0.9rem; }

    /* CMS toolbar (from the kitchen-cms-wire house markup) */
    #cms-bar { position: sticky; top: 0; z-index: 50; display: flex; gap: 0.6rem; align-items: center;
      padding: 0.5rem 1rem; background: #1c1c1c; border-bottom: 1px solid #333; font-size: 0.85rem; }
    #cms-bar[hidden] { display: none !important; }
    .cms-brand { font-weight: 600; color: #c9a96e; letter-spacing: 0.05em; }
    #cms-status { color: #8a8277; margin-left: auto; }
    #cms-bar button { background: #c9a96e; color: #111; border: 0; border-radius: 4px; padding: 0.3rem 0.7rem; font-weight: 600; cursor: pointer; }
    #cms-bar button[hidden] { display: none; }
    body.cms-editing [data-path] { outline: 1px dashed #c9a96e; outline-offset: 3px; border-radius: 2px; }
  </style>
</head>
<body>
  <!-- CMS bar starts hidden; @zms/core un-hides on ?edit / Cmd+E / button. -->
  <div id="cms-bar" hidden>
    <span class="cms-brand">ZMS DEMO</span>
    <button id="cms-impeccable" type="button">✦ Edit Live</button>
    <span id="cms-signin"></span>
    <button id="cms-edit" type="button" hidden>Edit page</button>
    <button id="cms-save" type="button" hidden>Save &amp; commit</button>
    <button id="cms-cancel" type="button" hidden>Cancel</button>
    <span id="cms-status">read-only</span>
  </div>

  <main>
    <h1 data-bind="hero.headline"></h1>
    <p class="subhead" data-bind="hero.subhead"></p>

    <h2>What it does</h2>
    <ul data-list="features" data-list-tag="li"></ul>

    <h2>Packages</h2>
    <div class="cards" data-cards="tools">
      <template>
        <div class="card">
          <h3 data-field="name"></h3>
          <p data-field="desc"></p>
        </div>
      </template>
    </div>
  </main>

  <script type="module">
    import { initZMS } from '/packages/core/src/editor.js';
    import { initCapture } from '/packages/capture/src/capture.js';
    const zms = initZMS({ brand: 'ZMS Demo' });
    const cap = initCapture({ apiBase: '/api', getToken: zms.getToken, brand: 'ZMS Demo' });
    // demo hook: ?note auto-opens the note popover on the headline (for screenshots)
    if (new URLSearchParams(location.search).has('note')) {
      window.addEventListener('load', () => setTimeout(() => {
        document.querySelector('#cms-bar').hidden = false;
        cap.openFor(document.querySelector('h1'));
      }, 400));
    }
  </script>
</body>
</html>
